];
let line=0;
function render(){clearTimeout(typeTimer);typing=false;let x=scenes[step];document.querySelector('#chapter').textContent=x.c;document.querySelector('#progress').innerHTML=scenes.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');content.innerHTML=`<section class="${x.end?'ending':'playing'}"><h1 tabindex="-1">${x.h}</h1><p class="sub">${x.s}</p><div class="stage"><span class="stamp">${x.stamp}</span>${x.art}<div class="subtitle"><small id="line-count"></small><p id="subtitle-text" aria-live="off"></p><button id="subtitle-next" aria-label="下一句字幕">▸</button></div><span class="note">${step===1||step===2?'◎ 模擬操作，無須相機':'✎ A LITTLE TRIP ABOUT DATA'}</span></div><p class="caption">${x.p}</p>${x.end?`<div class="explain"><h2>刪除 Cookie ≠ 刪除所有資料</h2><p><strong>Cookie</strong> 是瀏覽器儲存的小段資料，常用來記住登入或識別碼；照片等資料通常存放在<strong>伺服器</strong>，刪除 Cookie 不等於刪除這些資料。</p><p>故事借喻<strong>殭屍 Cookie</strong>：有些識別碼可能利用其他儲存資料，在刪除後重新建立。Cookie 本身並不是人臉照片，也不是所有 Cookie 都會「復活」。</p><p class="privacy-note">本遊戲全程模擬，不啟用相機、不蒐集個資。</p></div>`:''}<p class="type-hint">點一下顯示整段 · 再點進行操作 · 支援 Enter／空白鍵</p><div class="actions"><button id="next">${x.button}</button>${step>0&&!x.end?'<button id="restart" class="secondary">重新開始</button>':''}</div></section>`;line=0;updateSubtitle();document.querySelector('#subtitle-next').onclick=advance;document.querySelector('.subtitle').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON'&&typing)finishSubtitle()});document.querySelector('#next').onclick=advance;document.querySelector('#restart')?.addEventListener('click',restart)}
let typeTimer=null,typing=false,typed=0;
function updateSubtitle(){clearTimeout(typeTimer);const text=subtitles[step][line];typed=0;typing=true;document.querySelector('#line-count').textContent=step===0?'旅程前言':step===8?'旅程後記':'我的心聲';document.querySelector('#subtitle-next').hidden=false;document.querySelector('#next').textContent='顯示整段 ▸';document.querySelector('#subtitle-text').setAttribute('aria-label',text);document.querySelector('#subtitle-text').textContent='';
const tick=()=>{if(!typing)return;typed++;document.querySelector('#subtitle-text').textContent=Array.from(text).slice(0,typed).join('');if(typed>=Array.from(text).length){finishSubtitle();return}typeTimer=setTimeout(tick,/[，。？！…]/.test(Array.from(text)[typed-1])?160:32)};
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)finishSubtitle();else typeTimer=setTimeout(tick,80)}
function finishSubtitle(){clearTimeout(typeTimer);typing=false;document.querySelector('#subtitle-text').textContent=subtitles[step][line];document.querySelector('#subtitle-next').hidden=line===subtitles[step].length-1;document.querySelector('#next').textContent=line<subtitles[step].length-1?'繼續 ▸':scenes[step].button}
function restart(){clearTimeout(timer);step=0;render();content.querySelector('h1').focus();window.scrollTo({top:0,behavior:'smooth'})}
function advance(){if(document.querySelector('#next').disabled)return;if(typing){finishSubtitle();return}if(line<subtitles[step].length-1){line++;updateSubtitle();return}if(scenes[step].end){restart();return}if(scenes[step].scan){let b=document.querySelector('#next');b.disabled=true;b.textContent='模擬辨識中…';document.querySelector('.stage').innerHTML=`<span class="stamp">SIMULATION ONLY</span>${svg(`<g transform="translate(315 130) scale(1.4)">${face}<path d="M-65-65h20m-20 0v20m130-20h-20m20 0v20M-65 65h20m-20 0V45m130 20h-20m20 0V45"/><path class="scanline" d="M-60 0h120"/></g>`)}<span class="note">沒有開啟相機</span><div class="subtitle"><small>模擬辨識中</small><p>我看向螢幕，等待辨識完成……</p></div>`;timer=setTimeout(()=>{step++;render();content.querySelector('h1').focus()},1600)}else{step++;render();content.querySelector('h1').focus();window.scrollTo({top:0,behavior:'smooth'})}}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat&&!['BUTTON','A','INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();advance()}});
render();
</script></html>
